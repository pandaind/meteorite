[package]
name = "meteorite"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
rust-version.workspace = true
description = "A fast static site generator: Markdown content, YAML config, pluggable themes"
keywords = ["static-site", "markdown", "cms", "ssg"]
categories = ["command-line-utilities", "web-programming"]

[features]
default = []
images = ["meteorite-core/images"]

[[bin]]
name = "meteorite"
path = "src/main.rs"

[dependencies]
meteorite-core = { path = "../meteorite-core", version = "0.5.2" }
clap.workspace = true
miette.workspace = true
axum.workspace = true
tokio.workspace = true
notify.workspace = true
ureq.workspace = true
serde_json.workspace = true

[dev-dependencies]
sha2.workspace = true
base64.workspace = true
