[package]
name = "meteorite-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
rust-version.workspace = true
description = "Core library for the Meteorite static site generator"
keywords = ["static-site", "markdown", "ssg", "themes"]
categories = ["web-programming", "template-engine"]
# The integration tests use fixtures that live in the CLI crate.
exclude = ["tests/"]

[features]
default = []
# Image resizing via the `resize_image` template function.
images = ["dep:image"]

[dependencies]
serde.workspace = true
serde_norway.workspace = true
pulldown-cmark.workspace = true
tera.workspace = true
walkdir.workspace = true
thiserror.workspace = true
miette.workspace = true
chrono.workspace = true
syntect.workspace = true
rayon.workspace = true
sha2.workspace = true
base64.workspace = true
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "webp"] }
