{% extends "base.html" %}
{% block content %}
<section class="page-head container"><h1>{{ taxonomy.name | title }}</h1></section>
<section class="container section tight"><ul class="chips">
{% for t in terms %}<li><a class="chip" href="{{ url(path=t.url) }}">{{ t.name }} <span>{{ t.count }}</span></a></li>{% endfor %}
</ul></section>
{% endblock content %}
