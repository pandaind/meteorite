name: default
version: 0.2.0
description: Clean, readable starter theme with light and dark modes
author: Meteorite
meteorite_api: 1
params:
  color_scheme:
    default: auto
    description: "Initial mode: auto (follow the OS), light, or dark. Visitors can override with the toggle."
  theme_toggle:
    default: true
    description: Show the light/dark toggle button in the header
  accent:
    default: "#5b4de0"
    description: Accent colour in light mode (any CSS colour)
  accent_dark:
    default: "#a89cff"
    description: Accent colour in dark mode
  footer_text:
    default: ""
    description: Optional text shown in the footer
